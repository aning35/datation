name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'   # Trigger on version tags like v0.1.0
  workflow_dispatch:   # Allow manual trigger

# Required for creating GitHub Releases
permissions:
  contents: write

jobs:
  # =========================================================================
  # Build — macOS (Universal: arm64 + x86_64)
  # =========================================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Python dependencies
        run: uv sync

      - name: Install Electron dependencies
        run: |
          cd desktop
          npm ci

      - name: Build macOS DMG
        run: |
          cd desktop
          npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Datation-macOS
          path: desktop/release/*.dmg

  # =========================================================================
  # Build — Windows (x64)
  # =========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Python dependencies
        run: uv sync

      - name: Install Electron dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Windows installer
        run: |
          cd desktop
          npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Datation-Windows
          path: desktop/release/*.exe

  # =========================================================================
  # Build — Linux (AppImage + deb)
  # =========================================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Python dependencies
        run: uv sync

      - name: Install Electron dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Linux packages
        run: |
          cd desktop
          npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Datation-Linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

  # =========================================================================
  # Create GitHub Release (only on tag push)
  # =========================================================================
  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lhR release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
